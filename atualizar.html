<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Atualizando Gerador Data Matrix</title>
<style>body{font-family:Arial,sans-serif;background:#f4f7fa;color:#173b56;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:520px;margin:24px;padding:32px;border-radius:20px;background:#fff;text-align:center;box-shadow:0 8px 30px #0001}h1{font-size:24px}p{font-size:17px;line-height:1.5}</style>
</head>
<body><main class="box"><h1>Atualizando o gerador</h1><p id="status">Removendo a versão antiga e carregando a versão atual…</p></main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(r=>r.unregister()));
   }
   if('caches' in window){
     const names=await caches.keys();
     await Promise.all(names.map(n=>caches.delete(n)));
   }
   try{localStorage.removeItem('appVersion');localStorage.removeItem('version');}catch(e){}
   status.textContent='Versão antiga removida. Abrindo v1.1.30…';
   setTimeout(()=>location.replace('./index.html?release=1.1.30&reset='+Date.now()),700);
 }catch(e){
   status.textContent='Abrindo a versão atual…';
   setTimeout(()=>location.replace('./index.html?release=1.1.30&reset='+Date.now()),700);
 }
})();
</script></body></html>
