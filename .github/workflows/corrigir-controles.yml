name: Corrigir controles e layout por etiqueta
on:
  push:
    paths:
      - '.github/workflows/corrigir-controles.yml'
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir e validar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          js=Path('app.js'); s=js.read_text(); assert "const APP_VERSION = '1.1.6';" in s; js.write_text(s.replace("const APP_VERSION = '1.1.6';", "const APP_VERSION = '1.1.7';",1))
          html=Path('index.html'); s=html.read_text(); assert 'id="label-offset-x"' in s and '<script src="app.js"></script>' in s
          s=s.replace('1.1.6</span></span>','1.1.7</span></span>',1)
          s=s.replace('<script src="app.js"></script>','<script src="app.js"></script>\n<script src="calibracao.js?v=117"></script>',1)
          s=s.replace('A posição desloca as duas etiquetas juntas.','A posição desloca o conteúdo dentro de cada etiqueta.',1)
          html.write_text(s)
          css=Path('label-sizes.css'); s=css.read_text(); s+='''\n/* v1.1.7: deslocamento interno individual, sem deslocar a folha. */\n@media print {\n .print-page { left: 0 !important; }\n .print-copy .label-data, .print-copy .print-qr { position:relative !important; left:var(--label-offset-x, 0mm) !important; }\n .print-qr { transform:none !important; overflow:visible !important; }\n .print-qr canvas { transform:none !important; width:calc(25mm * var(--matrix-scale, 1)) !important; height:calc(10mm * var(--matrix-scale, 1)) !important; max-width:27.5mm !important; max-height:11mm !important; object-fit:contain !important; }\n html[data-label-size="40x30"] .print-copy { padding:1.2mm 1.5mm !important; }\n html[data-label-size="40x30"] .print-copy .label-data { max-width:100% !important; overflow:hidden !important; }\n html[data-label-size="40x30"] .print-copy .lot-line1 { font-size:min(var(--lot-value-font-print), 14pt) !important; white-space:nowrap !important; }\n}\n@media screen {\n .screen-label .label-qr, .screen-label .qr-area { transform:none !important; }\n .screen-label .label-data, .screen-label .qr-code { position:relative; left:var(--label-offset-preview, 0px); }\n .screen-label .qr-code canvas { transform:scale(var(--matrix-scale, 1)); transform-origin:center; }\n}\n'''; css.write_text(s)
          Path('calibracao.js').write_text('''// Calibracao independente: executa mesmo se o script principal falhar.\n(function () {\n  function start() {\n    const x = document.getElementById('label-offset-x');\n    const m = document.getElementById('matrix-scale');\n    const xo = document.getElementById('offset-x-value');\n    const mo = document.getElementById('matrix-scale-value');\n    if (!x || !m || !xo || !mo) return;\n    function read(key, fallback) { try { const v = Number(localStorage.getItem(key)); return Number.isFinite(v) ? v : fallback; } catch (_) { return fallback; } }\n    function clamp(input, value) { const min=Number(input.min), max=Number(input.max); return Math.min(max,Math.max(min,value)); }\n    x.value=String(clamp(x,read('labelOffsetX-v1',0)));\n    m.value=String(clamp(m,read('matrixScale-v1',100)));\n    function apply() {\n      const offset=Number(x.value), size=Number(m.value);\n      document.documentElement.style.setProperty('--label-offset-x',offset+'mm');\n      document.documentElement.style.setProperty('--label-offset-preview',(offset*10)+'px');\n      document.documentElement.style.setProperty('--matrix-scale',String(size/100));\n      xo.textContent=offset.toFixed(1).replace('.',',')+' mm';\n      mo.textContent=size+'%';\n      try { localStorage.setItem('labelOffsetX-v1',String(offset)); localStorage.setItem('matrixScale-v1',String(size)); } catch (_) {}\n    }\n    x.addEventListener('input',apply); m.addEventListener('input',apply);\n    [['offset-left',x,-0.2],['offset-right',x,0.2],['matrix-smaller',m,-5],['matrix-bigger',m,5]].forEach(function (entry) {\n      const button=document.getElementById(entry[0]); if (!button) return;\n      button.addEventListener('click',function () {\n        const input=entry[1]; input.value=String(clamp(input,Math.round((Number(input.value)+entry[2])*10)/10)); apply();\n      });\n    });\n    apply();\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true}); else start();\n})();\n''')
          sw=Path('sw.js'); s=sw.read_text(); assert 'v1.1.6-calibracao' in s; s=s.replace('v1.1.6-calibracao','v1.1.7-controles',1); s=s.replace("  './app.js',", "  './app.js',\n  './calibracao.js',",1); sw.write_text(s)
          Path('version.json').write_text('{\n  "version": "1.1.7"\n}\n')
          PY
          node --check app.js
          node --check calibracao.js
          grep -q 'calibracao.js' index.html
          grep -q 'print-page { left: 0' label-sizes.css
          git add app.js index.html label-sizes.css calibracao.js sw.js version.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: controles independentes e posicionamento individual v1.1.7'
          git push origin HEAD:main