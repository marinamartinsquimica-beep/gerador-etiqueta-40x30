name: Corrigir previa e Data Matrix v1.1.14
on:
  push:
    paths:
      - '.github/workflows/corrigir-previa-matrix-v1114.yml'
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar geometria identica na previa e na impressao
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css=Path('label-sizes.css')
          text=css.read_text(encoding='utf-8')
          assert '/* v1.1.12:' in text
          text+='''
          /* v1.1.14: mesma composicao na previa e na impressao; Data Matrix 12% maior
             em ambas as dimensoes, sem deformar os modulos. */
          @media print {
            html[data-label-size="40x30"] .print-copy .print-qr,
            html[data-label-size="40x30"] .print-copy .print-qr canvas {
              width: 28mm !important;
              height: 11.2mm !important;
              max-width: 28mm !important;
              max-height: 11.2mm !important;
              min-width: 28mm !important;
              min-height: 11.2mm !important;
              flex-basis: auto !important;
              transform: none !important;
              object-fit: fill !important;
            }
            html[data-label-size="40x30"] .print-copy .print-qr {
              transform: translateX(3mm) !important;
            }
          }
          @media screen {
            html[data-label-size="40x30"] .screen-label {
              width: 400px !important;
              height: 300px !important;
              min-width: 400px !important;
              max-width: none !important;
              box-sizing: border-box !important;
              padding: 10px !important;
              display: flex !important;
              flex-direction: column !important;
              align-items: center !important;
              justify-content: center !important;
              gap: 0 !important;
              overflow: hidden !important;
            }
            html[data-label-size="40x30"] .label-card { overflow-x: auto !important; justify-items: start !important; }
            html[data-label-size="40x30"] .screen-label .label-data {
              order: 1 !important;
              flex: 0 0 auto !important;
              position: relative !important;
              left: 0 !important;
              width: 330px !important;
              min-width: 330px !important;
              max-width: 330px !important;
              transform: translateX(30px) !important;
              text-align: center !important;
              overflow: visible !important;
            }
            html[data-label-size="40x30"] .screen-label .label-sku { margin: 0 !important; line-height: 1 !important; }
            html[data-label-size="40x30"] .screen-label .label-sku strong {
              font-size: calc(var(--sku-font-print) * 3.52756) !important;
              margin: 0 !important;
              line-height: 1 !important;
            }
            html[data-label-size="40x30"] .screen-label .label-sku > span,
            html[data-label-size="40x30"] .screen-label .label-lot > span { display: none !important; }
            html[data-label-size="40x30"] .screen-label .label-lot { margin: 0 !important; width: 330px !important; }
            html[data-label-size="40x30"] .screen-label .lot-value-two-lines {
              display: block !important;
              margin: 0 !important;
              width: 330px !important;
              text-align: center !important;
            }
            html[data-label-size="40x30"] .screen-label .lot-line1 {
              display: block !important;
              width: 330px !important;
              font-size: calc(var(--lot-value-font-print) * 3.52756) !important;
              letter-spacing: -1.235px !important;
              line-height: 1 !important;
              white-space: nowrap !important;
              transform: scaleX(.78) !important;
              transform-origin: center !important;
            }
            html[data-label-size="40x30"] .screen-label .lot-line2 { display: none !important; }
            html[data-label-size="40x30"] .screen-label .qr-code {
              order: 2 !important;
              flex: 0 0 112px !important;
              width: 280px !important;
              height: 112px !important;
              min-width: 280px !important;
              max-width: 280px !important;
              min-height: 112px !important;
              max-height: 112px !important;
              position: relative !important;
              left: 0 !important;
              transform: translateX(30px) !important;
              overflow: visible !important;
            }
            html[data-label-size="40x30"] .screen-label .qr-code canvas {
              display: block !important;
              width: 280px !important;
              height: 112px !important;
              min-width: 280px !important;
              min-height: 112px !important;
              max-width: 280px !important;
              max-height: 112px !important;
              transform: none !important;
              image-rendering: pixelated !important;
            }
          }
          '''
          css.write_text(text,encoding='utf-8')
          for filename in ('app.js','index.html','sw.js','version.json'):
            p=Path(filename)
            s=p.read_text(encoding='utf-8')
            assert '1.1.13' in s, filename+' nao esta na versao esperada'
            p.write_text(s.replace('1.1.13','1.1.14'),encoding='utf-8')
          PY
          node --check app.js
          node --check calibracao.js
          grep -q 'width: 280px !important' label-sizes.css
          git add label-sizes.css app.js index.html sw.js version.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: previa fiel e Data Matrix proporcionalmente maior v1.1.14'
          git push origin HEAD:main