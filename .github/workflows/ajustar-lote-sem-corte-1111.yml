name: Ajustar lote sem corte 1.1.11
on:
  push:
    paths:
      - '.github/workflows/ajustar-lote-sem-corte-1111.yml'
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcao e validar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css=Path('label-sizes.css')
          s=css.read_text()
          assert 'v1.1.10: centralizar' in s
          s+='''
          /* v1.1.11: impedir recorte lateral preservando altura da fonte escolhida.
             O deslocamento de 8 mm nao pode somar ao centro do campo de 36 mm.
             Condensar somente a largura da linha do lote, sem reduzir seus 18 pt. */
          @media print {
            html[data-label-size="40x30"] .print-copy {
              padding: 1mm !important;
              overflow: hidden !important;
            }
            html[data-label-size="40x30"] .print-copy .label-data {
              left: 0 !important;
              transform: translateX(0mm) !important;
              width: 38mm !important;
              max-width: 38mm !important;
              min-width: 38mm !important;
              overflow: visible !important;
              margin: 0 !important;
              text-align: center !important;
            }
            html[data-label-size="40x30"] .print-copy .label-lot,
            html[data-label-size="40x30"] .print-copy .lot-value-two-lines {
              width: 38mm !important;
              max-width: 38mm !important;
              overflow: visible !important;
              text-align: center !important;
            }
            html[data-label-size="40x30"] .print-copy .lot-line1 {
              width: 38mm !important;
              max-width: 38mm !important;
              white-space: nowrap !important;
              overflow: visible !important;
              transform: scaleX(.78) !important;
              transform-origin: center center !important;
              font-size: var(--lot-value-font-print) !important;
              letter-spacing: -0.35pt !important;
              text-align: center !important;
            }
            html[data-label-size="40x30"] .print-copy .print-qr {
              left: 0 !important;
              transform: translateX(0mm) !important;
              align-self: center !important;
            }
          }
          '''
          css.write_text(s)
          js=Path('app.js'); s=js.read_text(); assert "const APP_VERSION = '1.1.10';" in s; js.write_text(s.replace("const APP_VERSION = '1.1.10';", "const APP_VERSION = '1.1.11';",1))
          html=Path('index.html'); s=html.read_text(); assert '1.1.10</span>' in s; html.write_text(s.replace('1.1.10</span>','1.1.11</span>',1))
          Path('version.json').write_text('{\n  "version": "1.1.11"\n}\n')
          sw=Path('sw.js'); s=sw.read_text(); s=s.replace('v1.1.10','v1.1.11'); sw.write_text(s)
          PY
          node --check app.js
          node --check calibracao.js
          grep -q 'v1.1.11: impedir recorte' label-sizes.css
          grep -q '1.1.11' version.json
          git add app.js index.html label-sizes.css version.json sw.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: evitar corte lateral do lote v1.1.11'
          git push origin HEAD:main