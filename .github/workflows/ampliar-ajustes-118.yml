name: Ampliar ajustes 1.1.8
on:
  push:
    paths:
      - '.github/workflows/ampliar-ajustes-118.yml'
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ampliar controles e verificar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          js=Path('app.js'); s=js.read_text()
          assert "const APP_VERSION = '1.1.7';" in s
          assert 'lotValue: 20' in s
          assert "Math.min(5," in s
          s=s.replace("const APP_VERSION = '1.1.7';", "const APP_VERSION = '1.1.8';",1)
          s=s.replace('lotValue: 20', 'lotValue: 26',1)
          s=s.replace('Math.min(5,', 'Math.min(10,',1)
          js.write_text(s)
          html=Path('index.html'); s=html.read_text()
          assert 'id="label-offset-x" type="range" min="-5" max="5"' in s
          s=s.replace('id="label-offset-x" type="range" min="-5" max="5"','id="label-offset-x" type="range" min="-5" max="10"',1)
          assert '1.1.7</span></span>' in s
          s=s.replace('1.1.7</span></span>','1.1.8</span></span>',1)
          html.write_text(s)
          css=Path('label-sizes.css'); s=css.read_text()
          assert 'font-size:min(var(--lot-value-font-print), 14pt)' in s
          s=s.replace('font-size:min(var(--lot-value-font-print), 14pt)', 'font-size:var(--lot-value-font-print)',1)
          css.write_text(s)
          sw=Path('sw.js'); s=sw.read_text()
          assert 'v1.1.7' in s
          s=s.replace('v1.1.7','v1.1.8',1)
          sw.write_text(s)
          Path('version.json').write_text('{\n  "version": "1.1.8"\n}\n')
          PY
          node --check app.js
          grep -q 'max="10"' index.html
          grep -q 'lotValue: 26' app.js
          grep -q 'font-size:var(--lot-value-font-print)' label-sizes.css
          git add app.js index.html label-sizes.css sw.js version.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: ampliar deslocamento e lote v1.1.8'
          git push origin HEAD:main