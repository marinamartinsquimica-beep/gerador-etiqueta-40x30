name: Sincronizar versao 1.1.17
on:
  push:
    branches: [main]
    paths: ['.github/workflows/corrigir-versao-117.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Corrigir versoes sem alterar layout ou impressao
        shell: python
        run: |
          from pathlib import Path
          app = Path('app.js')
          source = app.read_text(encoding='utf-8')
          old = "const APP_VERSION = '1.1.15';"
          assert source.count(old) == 1, 'Versao inesperada em app.js; nenhuma alteracao realizada'
          app.write_text(source.replace(old, "const APP_VERSION = '1.1.17';"), encoding='utf-8')
          index = Path('index.html')
          source = index.read_text(encoding='utf-8')
          old = '<span id="app-version">1.1.16</span>'
          assert source.count(old) == 1, 'Versao inesperada em index.html; nenhuma alteracao realizada'
          source = source.replace(old, '<span id="app-version">1.1.17</span>')
          source = source.replace('src="app.js"', 'src="app.js?v=117"')
          source = source.replace('src="calibracao.js?v=116"', 'src="calibracao.js?v=117"')
          source = source.replace('href="ajuste-v1.1.16.css"', 'href="ajuste-v1.1.16.css?v=117"')
          index.write_text(source, encoding='utf-8')
          assert '"version": "1.1.17"' in Path('version.json').read_text(encoding='utf-8')
          assert "eme-etiqueta-v1.1.17" in Path('sw.js').read_text(encoding='utf-8')
          print('OK: app.js, index.html, version.json e sw.js sincronizados em 1.1.17')
      - name: Publicar correcoes na branch main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git diff --cached --check
          git diff --cached --quiet || (git commit -m 'fix: sincronizar versao 1.1.17 no app e na pagina' && git push origin HEAD:main)
